<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鍵盤の上まで運ばれるか(実機の切り分け)</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 16px/1.6 system-ui, sans-serif;
      }
      p {
        color: #555;
      }
      .spacer {
        block-size: 90vh;
      }
      .case {
        margin-block-end: 24px;
      }
      label {
        display: block;
        font-size: 14px;
        margin-block-end: 4px;
      }
      input {
        inline-size: 100%;
        box-sizing: border-box;
        font-size: 16px;
        padding: 12px;
        border: 1px solid #999;
        border-radius: 8px;
      }
      .panel {
        margin: 0;
        border: 1px solid #999;
        border-radius: 8px;
        padding: 8px;
        background: #fff;
      }
      [popover] {
        position: fixed;
        inset: auto;
      }
      .below {
        position: absolute;
        z-index: 10;
        background: #fff;
        border: 1px solid #999;
        border-radius: 8px;
        padding: 8px;
      }
      .wrap {
        position: relative;
      }
    </style>
  </head>
  <body>
    <h1>鍵盤の上まで運ばれるか</h1>
    <p>
      それぞれの欄を押して、iOS が欄を鍵盤の上まで運ぶかどうかを見る。運ばれない欄があれば、その欄の作りが
      原因である。下まで送ってから、いちばん下の欄を押すこと。
    </p>

    <div class="spacer"></div>

    <div class="case">
      <label for="a">A 素の欄(何も付いていない)</label>
      <input id="a" type="text" placeholder="押す" />
    </div>

    <div class="case">
      <label for="b">B 押すと top-layer の面が開く欄(popover)</label>
      <div class="wrap">
        <input id="b" type="text" placeholder="押す" />
        <ul class="panel" id="b-panel" popover>
          <li>候補 1</li>
          <li>候補 2</li>
          <li>候補 3</li>
        </ul>
      </div>
    </div>

    <div class="case">
      <label for="c">C 押すと普通の面が開く欄(top-layer を使わない)</label>
      <div class="wrap">
        <input id="c" type="text" placeholder="押す" />
        <ul class="panel below" id="c-panel" hidden>
          <li>候補 1</li>
          <li>候補 2</li>
          <li>候補 3</li>
        </ul>
      </div>
    </div>

    <div class="case">
      <label for="d">D 面を開かない欄(Combobox と同じ入れ子だけ)</label>
      <div class="wrap"><div><div><input id="d" type="text" placeholder="押す" /></div></div></div>
    </div>

    <div class="spacer"></div>

    <script type="module">
      const b = document.getElementById('b');
      const bPanel = document.getElementById('b-panel');
      // 面の位置は、画面が動くたびに置き直す(押した時点の座標のままだと、鍵盤で版面が動いた分ずれる)
      const placeB = () => {
        if (!bPanel.matches(':popover-open')) return;
        const r = b.getBoundingClientRect();
        bPanel.style.insetBlockStart = `${r.bottom + 4}px`;
        bPanel.style.insetInlineStart = `${r.left}px`;
        bPanel.style.inlineSize = `${r.width}px`;
      };
      b.addEventListener('pointerup', () => {
        if (!bPanel.matches(':popover-open')) bPanel.showPopover();
        placeB();
      });
      addEventListener('scroll', placeB, true);
      addEventListener('resize', placeB);
      visualViewport?.addEventListener('resize', placeB);
      visualViewport?.addEventListener('scroll', placeB);
      b.addEventListener('blur', () => bPanel.matches(':popover-open') && bPanel.hidePopover());

      const c = document.getElementById('c');
      const cPanel = document.getElementById('c-panel');
      c.addEventListener('pointerup', () => {
        cPanel.hidden = false;
        cPanel.style.insetBlockStart = `${c.offsetTop + c.offsetHeight + 4}px`;
        cPanel.style.inlineSize = `${c.offsetWidth}px`;
      });
      c.addEventListener('blur', () => (cPanel.hidden = true));
    </script>
  </body>
</html>
